; army description
desc_Militia=由普通平民组成的部队，战斗力不强。
desc_Line Infantry=训练有素的步兵，是陆军中的主力部队。
desc_Light Infantry=能在复杂地形中保持较高的行动力，射击准确度高，但是防御力较低。
desc_Grenadier=由强壮高大的步兵组成，战斗力强。能在战场上对固定目标投掷炸弹。
desc_Guards=最优秀的步兵，拥有强大的攻击力和防护力，能够对固定目标投掷炸弹。
desc_Machine Gun=这种新型武器能够连续射击，对步兵和骑兵造成致命打击。但是行动力较差。
desc_Light Cavalry=拥有很高的行动力，但防御力较低。冲锋时使敌军士气下降，歼敌后可连续攻击。
desc_Heavy Cavalry=拥有不错的战斗力和防御力。冲锋时使敌军士气下降，歼敌后可连续攻击。
desc_Guards Cavalry=最优秀的骑兵，拥有最强的战斗力。冲锋时使敌军士气下降，歼敌后可连续攻击。
desc_Armored Car=拥有装甲防护并装备机枪的新式战车。冲锋时使敌军士气下降，歼敌后可连续攻击。
desc_Light Artillery=拥有不错的火力和较远的射程，用于支援和掩护其他兵种。
desc_Heavy Artillery=拥有强大的火力和较远的射程，可以轻易的火力压制敌军。但行动力较低。
desc_Siege Artillery=专门用于摧毁建筑物的火炮，但无法攻击近距离目标，行动力较低。
desc_Rocket=这种新型武器能够将敌军阵地变成一片火海。但防护力很弱。
desc_Privateer=拥有出色的行动力，用于巡逻任务或袭击对方的运输船。
desc_Frigate=拥有不错的防护力和攻击力，通常负责海上护航，可以对敌军进行远程打击。
desc_Battleship=海战中的主力军舰，巨大的船体装备了大口径火炮，能给敌军致命的打击。
desc_Ironclad=拥有大口径火炮，并配备了厚重装甲的军舰。海战中的霸主。
desc_Small Fortress=临时搭建的木制要塞，难以抵挡火炮的攻击。需要2个回合建造。
desc_Fortress=坚固而且配备有火炮的要塞，很难被攻克。需要3个回合建造。
desc_Large Fortress=使用最先进的技术建造的要塞，巨大坚固并配备了新型火炮。需要4个回合建造。
desc_Coastal Fort=能对敌方战舰造成巨大的伤害，不适合攻击陆地上的敌军。需要3个回合建造。
desc_Trench=战壕可以有效的防御敌方步兵的攻击。
desc_Fence=主要用于防御敌方骑兵的攻击，对敌方步兵也有一定的防御作用。
desc_Bunker=可以有效减少火炮对该区域内部队的伤害，对敌方步兵也有一定的防御作用。


