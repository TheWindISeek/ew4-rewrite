desc_Snare Drum=军鼓声鼓舞着部队，即使遭受损失也能保持最高的战斗力
desc_Tent Tentage=普通的帐篷，部队在野外驻扎时补给+4
desc_Army Tentage=专业的行军帐篷，部队在野外驻扎时补给+8
desc_Military Camp=最高级的军用帐篷，部队在野外驻扎时补给+12
desc_Spirit=酒精含量高的烈酒，可以使部队士气高昂
