;occupy
desc_occupy 1=士兵们！现在还不是休息的时候，继续前进，我们需要占领更多的地区！
desc_occupy 2=我的军队需要在这里休整，为下一步的进攻做好准备。
desc_occupy 3=在不断的攻占敌人领土后，我将获得更多的荣耀。士兵们！我们可以好好的庆祝一下。
desc_occupy 4=我宣布！这个地区的领土已经属于我们的国家。
desc_occupy 5=士兵们，不要放松！将有更多的地区等着我们去征服。
desc_occupy 6=这里已经插上我们国家的旗帜，任何敌人都无法阻挡我们。

;destroy enemy
desc_destroy enemy 1=敌人已经在我的猛攻下溃散了。士兵们，让更多的敌人倒在我们的脚下吧！
desc_destroy enemy 2=我们轻松的歼灭了敌军，这是个好的开始。
desc_destroy enemy 3=敌人的炮火虽然猛烈，可是依然无法阻止我前进。
desc_destroy enemy 4=看来等战争结束，我们又能获得更多的奖赏了。
desc_destroy enemy 5=对手根本不堪一击，我需要真正的对手。
desc_destroy enemy 6=弱者，根本无法在战场上生存！胜利只属于强者。

;alliance protest
desc_alliance protest 1=你们侵占了我国的领土，这样做会影响我们之间的友谊。
desc_alliance protest 2=我需要提醒你，我不会再容忍你无礼的行为！
desc_alliance protest 3=你的军队出现在了不该出现的地方！
desc_alliance protest 4=我不希望再看到类似的情况发生。

;neutral protest
desc_neutral protest 1=我不想与你为敌，但这不表示你就可以为所欲为。
desc_neutral protest 2=你还想继续维持我们之间的和平么？
desc_neutral protest 3=立刻停止进攻，我们还可能保持和平状态。
desc_neutral protest 4=为什么要攻击我们，难道你想引发战争吗？

;alliance neutral
desc_alliance neutral 1=我很遗憾的通知你，我们的同盟关系到此为止了。
desc_alliance neutral 2=你的这种行为已经威胁到了我国的利益，我们不再是盟友了。
desc_alliance neutral 3=我刚刚接到命令，我们的合作关系已经结束了。
desc_alliance neutral 4=由于你这种错误的行为，导致我们的同盟关系就此终止。


;neutral declarewar
desc_neutral declarewar 1=虽然我不想与你为敌，但是很遗憾，战争开始了。
desc_neutral declarewar 2=我刚刚做出一个艰难的决定，我的军队将向你发动攻击。
desc_neutral declarewar 3=是你让我们不得不拿起武器保卫国家！
desc_neutral declarewar 4=是你首先挑起了战争，你必须为此负责！

;retreat
desc_retreat 1=为了反击，我们必须保存实力,暂时的撤退并不代表失败。
desc_retreat 2=也许是我突进的太快了，目前除了撤退没有其他选择。
desc_retreat 3=我已经奋战到了最后一刻，但是仍然无法击退敌军。
desc_retreat 4=敌军的顽强超出了我的预期，我需要重新制定战术。
desc_retreat 5=我的部队损失惨重，在我进攻的时候为什么没有人为我掩护？
desc_retreat 6=我的军队已经无法适应目前的战局，现在必须到后方进行休整。

;dialogues
desc_dialogue 1=这次我们没有退路，请各位全力以赴的作战。
desc_dialogue 2=虽然我们损失很大，但是为了身后的国家，我们绝不后退！
desc_dialogue 3=我绝不允许我的士兵后退一步，任何后退的士兵都将被处决。
desc_dialogue 4=我希望大家明白，这是我们获胜最后的机会，一定要把握住！
desc_dialogue 5=现在还不是休息的时候，我们需要尽快赶赴指定地点。
desc_dialogue 6=士兵们，我保证你们很快可以和家人团聚。前提是你们要很好的执行我的计划。
desc_dialogue 7=我们具有压倒性的优势，必须快速的取得这场战争的胜利。
desc_dialogue 8=我的军队会像匕首一样插入敌人的腹地，我们决定着战争的胜负。
desc_dialogue 9=我的先头部队已经发现了敌军，战争马上就要开始了。
desc_dialogue 10=虽然我们的情况非常糟糕，但是敌人也不比我们好到哪里去！
desc_dialogue 11=各位将军，我想现在是时候给敌人致命的一击了。
desc_dialogue 12=现在正是国家最需要我们的时候，我会战斗到最后。
desc_dialogue 13=士兵们！侵略者就在你们的面前，握紧你们手中的武器，前进！
desc_dialogue 14=敌人的炮弹无法阻挡我们前进，我会取得最后的胜利。
desc_dialogue 15=将军们，你们应该非常清楚，这场战争的结果将改变历史。
desc_dialogue 16=这是上帝赐予的机会，全体集合！向敌军发起攻击。
desc_dialogue 17=拿起手中的武器来保卫我们的国家。将入侵者全部消灭！
desc_dialogue 18=已经到了决战的时刻，不要被眼前的敌人吓倒，跟着我冲锋！
desc_dialogue 19=为了彻底消除敌人的威胁，我们需要和敌军主力进行一次决战。
desc_dialogue 20=我保证！只要这场战争我们获胜，每一名士兵都能获得最丰厚的奖赏。
desc_dialogue 21=我希望我们能获胜，这样我们就赢得了独立和自由！
desc_dialogue 22=我们要夺回失去的土地。战士们，跟住我的步伐！
desc_dialogue 23=我们都害怕死亡！但为了祖国，为了家人，我们必须面对这一切。
desc_dialogue 24=我们需要像洪水一样向敌军阵地发起冲锋，每个士兵都应该非常英勇。
desc_dialogue 25=我们的优势已经非常明显，如果能赶在敌人的援军到来前结束战斗,胜利就属于我们！
desc_dialogue 26=敌人已经做好了殊死抵抗的准备，这将是一场非常艰苦的战斗。
desc_dialogue 27=敌军已经对我们发动了多次猛烈的攻击，希望你能够体会我的难处。
desc_dialogue 28=前面的失败让我们颜面无存，现在必须用一场胜利来鼓舞军队的士气。
desc_dialogue 29=如果你们独自攻击敌军阵地，胜利的可能性非常小。我们需要联合。
desc_dialogue 30=我已经无法容忍敌军对我们的挑衅，士兵们，反击！
desc_dialogue 31=敌军企图包围我们，我需要立刻调整战术。
desc_dialogue 32=你面对的敌军将领是个非常厉害的家伙！请小心。
desc_dialogue 33=这是敌军最精锐的部队，如果大家不全力以赴是无法获得胜利的。
desc_dialogue 34=帝国已经到了最危险的时刻。这次战役将决定国家的命运，同时也决定我们自己的命运。
desc_dialogue 35=将军们，你们犯了一连串的错误。我们现在的局面变得非常糟糕。
desc_dialogue 36=在之前的战役中我们处于劣势，甚至我们的士兵都害怕听到敌军统帅的名字。
desc_dialogue 37=我们所有的军队都投入到这场战争中，如果我们失败后果将非常严重。
desc_dialogue 38=我命令所有的预备队都投入到战斗中，同时我本人也会和国家共存亡！
desc_dialogue 39=士兵们，我们是狮子，敌人是绵羊。现在捕猎的时间到了。
desc_dialogue 40=让所有的敌人在我们的炮火中消失，我要让他们听到我的名字就发抖。
desc_dialogue 41=各位将军,你们了解我的实力，请把这场战争最精彩的部分留给我。
desc_dialogue 42=我根本不需要援军，我的军队可以轻松对付前方的敌军。
desc_dialogue 43=这些敌军简直不堪一击，我已经很久没有遇到真正的对手了。
desc_dialogue 44=应该告诉我们的敌人，如果现在放下武器从战场上离开还来得及!
desc_dialogue 45=我们突进的速度实在是太快了，敌人根本没有意识到我们已经到了他们的后方。
desc_dialogue 46=在战场上永远都会有机会！如果没有，那就去创造机会。
desc_dialogue 47=不要小看我们这次的对手，他们都是经验丰富的战士。
desc_dialogue 48=我的军队会像利剑一样劈开敌人的防线。
desc_dialogue 49=看来我们离战场已经非常近了，我已经隐约可以听到炮声。
desc_dialogue 50=我们的计划已经成功了，全军进攻！
desc_dialogue 51=因为有了你们的援助，相信这次我会很快获得胜利。
desc_dialogue 52=敌军应该已经能听到我们整齐的脚步声和有节奏的鼓声。
desc_dialogue 53=我的军队已经摆好了阵型，密集的火力会让敌军根本无法接近我们。
desc_dialogue 54=快点排好阵型准备射击，敌人的骑兵马上就要冲过来了。
desc_dialogue 55=所有士兵在射击完后将你们的刺刀都装配上，准备冲锋。
desc_dialogue 56=我们遭到骑兵猛烈的攻击，必须迅速转变阵型。
desc_dialogue 57=敌军前方的要塞是我们前进最大的障碍，必须将它彻底攻陷。
desc_dialogue 58=如果使用围城炮，我们攻克敌军要塞的把握会大很多。
desc_dialogue 59=在兵力不多的情况下，我们必须绕过前方的要塞才可以到达指定地点。
desc_dialogue 60=我命令所有的舰船不要轻易靠近敌军的海岸炮。
desc_dialogue 61=前面的要塞非常的坚固，选择进攻这里显然并不明智。
desc_dialogue 62=敌军的主力已经向我的要塞靠近，我会让他们知道我的要塞有多么坚固。
desc_dialogue 63=敌人的要塞太坚固了，我需要火炮支援。
desc_dialogue 64=敌军已经快要攻陷我的要塞了！
desc_dialogue 65=敌军的海岸炮太多了，我的舰队无法靠近岸边。
desc_dialogue 66=敌军舰队的火力非常猛烈，一定要想个办法避开他们。
desc_dialogue 67=敌军舰队已经出现，全速前进！集中一切火力将敌军的战舰击沉。
desc_dialogue 68=我的舰队可以轻松的击败敌人!我希望你们能赶上我的步伐。
desc_dialogue 69=我会帮助你对付敌人的战舰，保证你的部队尽快登陆。
desc_dialogue 70=我的舰队受损严重，没想到敌军的战舰火力竟然如此凶猛。
desc_dialogue 71=你们现在防守的港口地理位置非常重要。请一定要守住!
desc_dialogue 72=我的舰队将全力给你提供掩护，你们一定要以最快的速度登陆。
desc_dialogue 73=我所有的火炮都已经准备就绪，只等你开火的命令。
desc_dialogue 74=敌军守城的部队仍然不肯撤退，让我用火炮瓦解他们的最后的意志。
desc_dialogue 75=当我的火炮开始攻击时，请你们的骑兵和步兵作好冲锋的准备。
desc_dialogue 76=请保护好我的炮兵，我们无法经受敌军骑兵的攻击。
desc_dialogue 77=集中使用炮兵是我经常获胜的原因之一，要让敌军畏惧我们的炮火。
desc_dialogue 78=当敌军进入了我们的射程就猛烈的攻击，千万别让他们靠近。
desc_dialogue 79=我们的火炮将不间断的向这座城市发射炮弹，直到他们投降为止。
desc_dialogue 80=我的炮兵部队会给你们强大的火力支援！
desc_dialogue 81=我们的骑兵须要尽量绕开山脉和树林，否则很难发挥出应有的速度优势。
desc_dialogue 82=从侧翼突袭敌军，我们的出现会让敌军大吃一惊！
desc_dialogue 83=我的骑兵只用了几天就突破了敌军的防线，我们的速度已经超出了他们的想象。
desc_dialogue 84=敌人应该能够听到我骑兵的马蹄声吧，难道他们还不感到恐惧么？
desc_dialogue 85=敌军的步兵和炮兵都不在平原上，这样的地形让我的骑兵很难发挥出优势。
desc_dialogue 86=敌军后方的城市防御十分薄弱，我的骑兵会快速将这些据点占领。
desc_dialogue 87=敌军根本无法阻挡我的骑兵的突袭。
desc_dialogue 88=大家都记住！炮兵最怕我们骑兵，遇到敌军炮兵就要不停的进攻。
desc_dialogue 89=我们的部队损失惨重。我现在需要你们的援助！
desc_dialogue 90=我们已经被敌军包围，如果没有援助，被消灭只是时间问题。
desc_dialogue 91=敌人的部队已经攻破了我们的防线，预备队现在在哪里？
desc_dialogue 92=我的后方怎么会出现敌军？这绝对是个最坏的消息。
desc_dialogue 93=如果能得到你们的援助，我就可以快速的结束这场战争。
desc_dialogue 94=将军们，你们的部队在那里？我需要你们保护我的后方。
desc_dialogue 95=敌人已经切断了我们的退路，我现在能做的就是等待援军的到来。
desc_dialogue 96=我将负责这里的防守。各位将军，如果可以请尽早过来援助我。
desc_dialogue 97=敌军的主力已经开始向我的阵地发起猛攻，我需要援助。
desc_dialogue 98=我们的粮食已经不多，我不希望我的士兵都饿着肚子作战。
desc_dialogue 99=我们的部队携带的食物有限，必须尽快的结束这场战斗。
desc_dialogue 100=你们答应运送给我的食物为什么到现在还没送到？
desc_dialogue 101=敌人的农场将会为我们提供足够的食物！士兵们，去占领他们的农场。
desc_dialogue 102=快点占领敌军的农场，不要给敌军留下一粒粮食。
desc_dialogue 103=我们已经被敌军包围，可能过不了多久就会被消灭。
desc_dialogue 104=敌人的攻势太过于猛烈，我们基本上没有获胜的可能。
desc_dialogue 105=在这个关键的时刻，撤退就等于放弃以前所有的努力。
desc_dialogue 106=敌人的军队数量超出了我们好几倍，我想我们可能无法取得胜利了。
desc_dialogue 107=将军们，面对现实吧。我们已经输掉了这场战争。
desc_dialogue 108=军队已经开始溃散，看来我们要做好撤退的准备了。
desc_dialogue 109=目前的状况已经不可能让我们再发动进攻了。
desc_dialogue 110=敌人的防线太坚固了，以我们现有的兵力很难从正面突破。
desc_dialogue 111=糟糕的天气已经让我的军队失去了战斗力！
desc_dialogue 112=我们的盟友已经被敌人消灭了，目前我们只能依靠我们自己。
desc_dialogue 113=我的军队面临被敌人包围的危险，现在该怎么做？
desc_dialogue 114=将军们，这样下去我们可能会全军覆没。
desc_dialogue 115=士兵们都在议论，这里的抵抗是否已经失去了意义？
desc_dialogue 116=这是一场毫无意义的战争，为什么一定要我要参加这场战争？
desc_dialogue 117=请坚持住！我的军队会尽快赶到战场。
desc_dialogue 118=集结部队需要一定的时间，请再坚持一会儿。
desc_dialogue 119=根据计划我将会保护您的侧翼不受到攻击，你们可以放心的进攻。
desc_dialogue 120=我需要你们的配合才能夺取敌军的城市。请给我最大的支持。
desc_dialogue 121=我会尽量坚持到援军的到来，也请你的军队加快进军的速度！
desc_dialogue 122=如果时间允许，我的军队将会配合你从敌军的后方发起进攻。
desc_dialogue 123=加速前进！不能让敌人击溃我们的盟友。
desc_dialogue 124=由于敌人的援军大量的加入战场，我的军队目前损失很大。
desc_dialogue 125=我的军队在和敌军的作战中损失很大，可能无法再帮助你了。
desc_dialogue 126=盟友并没有延缓敌军前进的速度，看来我高估他们的实力了。
desc_dialogue 127=为了能尽快取得胜利，我需要你在海面上配合我的行动。
desc_dialogue 128=你的军队作战实在是太勇猛了，你是怎么做到的？
desc_dialogue 129=太精彩了！我亲眼看到了你运用高超的战术击退敌军。
desc_dialogue 130=你是我见过最优秀的将领，如果我们合作能取得更多的战绩。
desc_dialogue 131=居然能够那么快击败敌军，你简直是一个战争天才。
desc_dialogue 132=你的知名度非常高，我为能和你并肩作战而感到骄傲。
desc_dialogue 133=我无法想象这一切是真的，我们真的击败了敌军！
desc_dialogue 134=我已经被任命为军队的总指挥，我将全权负责这次战役。
desc_dialogue 135=我是一名职业军人，我忠于我的国家和人民。
desc_dialogue 136=我已经处决了几个企图逃跑的士兵，不用怀疑我对国家的忠诚！
desc_dialogue 137=你们并没有按照计划向敌军发起攻击，我有理由怀疑你们对国家的忠诚！
desc_dialogue 138=各位将军们，我希望我们能在敌军的首都会师。
desc_dialogue 139=我们已经占领了敌人的首都，胜利只是时间问题。
desc_dialogue 140=进攻敌军首都的命令已经交给了我，这将是我们军事生涯最辉煌的时刻。
desc_dialogue 141=无论如何也不能放弃我们的首都，我想你应该明白这一点。
desc_dialogue 142=看到敌军首都了吧？我们只要攻占这里，战争就结束了。
desc_dialogue 143=首都沦陷的消息让我们都非常沮丧！
desc_dialogue 144=虽然我们已经占领了敌军的首都，但敌军残留的部队依然对我们存在威胁。
desc_dialogue 145=城市、工厂、马厩、军港、农场都能升级，也能为部队提供补给。
desc_dialogue 146=将军在战争中可以积累经验来提升军衔和爵位。
desc_dialogue 147=农场会生产食物，如果部队缺少食物将无法作战。
desc_dialogue 148=围城炮是对付敌方要塞和海岸炮的专家，也能给敌方建筑中的部队造成致命打击。
desc_dialogue 149=每个将军都可以携带两个物品，它们会让将军获得更强的能力。
desc_dialogue 150=拥有旗帜的将军可以对周围的友军提供支援。
desc_dialogue 151=不同国家的部队能力存在差异，比如英国的军舰比其它国家的都要强。
desc_dialogue 152=市场能够兑换资源，商店能购买物品，酒馆能招募将军。
desc_dialogue 153=将军的技能会在战场上发挥巨大的作用。
desc_dialogue 154=相同类型的部队如果编队数量越多，招募需要的资源也越多，当然战斗力会更强。
desc_dialogue 155=轻步兵可以在复杂地形中保持最高的行动力。
desc_dialogue 156=掷弹兵和近卫军是步兵中的多面手，他们能对付各种类型的敌军。
desc_dialogue 157=机枪虽然行动力较差，但能对骑兵和步兵造成致命打击。
desc_dialogue 158=骑兵拥有最高的行动力，对敌军的步兵或炮兵攻击后能使敌军士气下降，并在歼敌后再次行动。
desc_dialogue 159=在炮火的攻击下目标区域很容易着火。部队在燃烧的区域会受到伤害。
desc_dialogue 160=建造要塞可以增强陆地防御，海岸炮能对舰船造成巨大的伤害，但它们都要一定的建造时间。
desc_dialogue 161=战壕，栅栏，掩体能够对部队提供保护，但是必须由步兵来建造。
desc_dialogue 162=夹击和包围会让敌方部队士气下降，可以减弱敌方部队的攻击力和防御力。
desc_dialogue 163=一旦部队发生混乱他们将不会执行任何命令！
desc_dialogue 164=当食物不足时部队会士气下降，食物严重不足时部队会混乱。
desc_dialogue 165=当将领有训练技能时，可训练提升所在部队的等级。
desc_dialogue 166=不要随便占领友军的建筑，这可能会使他们解除与你的同盟关系！
desc_dialogue 167=陆军部队在海中的攻击力会大幅下降。
desc_dialogue 168=如果能完成战役中的特殊目标就可以解锁特殊章节！
desc_dialogue 169=我已经做好了充分的准备，就等着敌军过来！
desc_dialogue 170=我们已经构筑了坚固的防线来等待敌军。
desc_dialogue 171=现在的局势下，主动进攻显然不太实际。我们能做的就是防守。
desc_dialogue 172=你们可以放心的把防御的任务交给我，敌军无法踏进我们的国土。
desc_dialogue 173=全军收缩防线，等待援军的到来！坚持住！
desc_dialogue 174=我的军队将尽全力来保卫这座城市，一定不让它落入敌军的手中。
desc_dialogue 175=为了阻止我们继续推进，敌军在我们面前修建了规模巨大的防御工事。
desc_dialogue 176=为什么我的侧面会突然出现敌军？我命令全军转入防守状态。
desc_dialogue 177=我们需要渡过前面的河流，向对岸的敌军发起全面进攻。
desc_dialogue 178=占领前方的桥梁，否则渡河会耗费我们不少时间。
desc_dialogue 179=敌军的炮兵部署在了河流对面，这对我们很不利。
desc_dialogue 180=一旦让敌军渡过前面的河，他们就会威胁到我们很多城市的安全。
desc_dialogue 181=如果敌军进入树林，我们的火炮就不太容易击中他们。
desc_dialogue 182=前方出现了大片树林，我的骑兵速度优势将很难发挥。
desc_dialogue 183=我们会从几个方向同时向敌军边境发起攻击，我们的优势很明显。
desc_dialogue 184=我的军团已经将敌军分割包围，歼灭敌军只是时间问题。
desc_dialogue 185=这里是我们最后的防线，你们应该知道这里的重要性。
desc_dialogue 186=我们必须在这里阻挡敌军的进攻，任何形式的撤退都将视为叛国。
desc_dialogue 187=敌人前线的军队很强大，但是后方的防御力量比较薄弱。你应该明白我的意思！
desc_dialogue 188=起义军已经答应配合我们，现在是我们进军的好时机！
desc_dialogue 189=我们不能太乐观，冬季的寒冷会严重影响我军的战斗力。
desc_dialogue 190=为了这次战争我们已经准备了一年多。这将是一场规模巨大的登陆作战。
desc_dialogue 191=敌军的补给出现了严重的问题。发起反攻的时刻到了！
desc_dialogue 192=在没有做好准备前贸然对敌军进攻是相当危险的。
desc_dialogue 193=我渴望和敌军决战，为什么还不下命令，这一刻我已经等了很久了！
desc_dialogue 194=我们需要夺取前方的城市，为下一步进攻做好准备。
desc_dialogue 195=这是我们遇到的最大的危机，我们不得不面对数倍于我们的敌人。
desc_dialogue 196=登陆部队不要和敌军的战舰纠缠，你们只需要快速登陆就够了。
desc_dialogue 197=这次敌军舰队的规模十分庞大，我的战舰恐怕不能支撑太长的时间。
desc_dialogue 198=为了迷惑敌军，我会假装从正面向敌人的防线进攻。
desc_dialogue 199=我已经完成了对敌人的包围，现在我们要做的就是将他们全部消灭。
desc_dialogue 200=拖延敌军的计划已经成功了，我们的援军已经集结完毕。
desc_dialogue 201=我不允许任何侵略者登陆我们的领土！将他们消灭在海里。
desc_dialogue 202=我们的部队现在非常的分散，必须等待部队集结后才能发动进攻。
desc_dialogue 203=请注意：这次战役中敌军会使用他们最新的武器。
desc_dialogue 204=敌军前进的道路已经被我完全封锁了。
desc_dialogue 205=敌军会先向我的阵地发起攻击在我的预料之外，我不知道他们接下来还想干什么？
desc_dialogue 206=我的计划已经成功，敌军已经进入了我们的陷阱之中。
desc_dialogue 207=现在我们需要从海上和陆地联合向敌军发动进攻。
desc_dialogue 208=友军的部队显然已经被击败了，这真不是什么好消息。
desc_dialogue 209=敌人前进的速度太快了，我的防线还没有完全准备好。
desc_dialogue 210=确切的说敌军已经早于我们占领了有利的地形，目前我们处于被动的局势。
desc_dialogue 211=虽然敌军的数量多于我们，但是他们作战能力很有限。我们将赢得这场战争。
desc_dialogue 212=我们从正面攻击是没有机会的，我建议你绕过敌军防线，对敌人进行突袭。
desc_dialogue 213=全力阻挡住敌人的进攻，绝不能让敌人靠近我们的海岸线。
desc_dialogue 214=我的军队已经连续向这座城市发起了多次进攻，我相信敌人没有一点喘息的机会。
desc_dialogue 215=敌军还没有做好战斗的准备，目前他们士兵的战斗力非常的弱，击败他们只是时间问题。
desc_dialogue 216=敌军的外围防线已经被我突破！
desc_dialogue 217=我们的外围防线已经被敌军攻破！
desc_dialogue 218=敌军在这次战争中投入了大量的军队，现在一定要保存好我们的实力。
desc_dialogue 219=如果敌军的计划成功，我们将面对腹背受敌的危险。
desc_dialogue 220=敌军在我们进军的路线上设置了很多的障碍。
desc_dialogue 221=我们还不知道敌人的真正意图，贸然的进攻是相当危险的。
desc_dialogue 222=看来敌人的计划比我们估计的要庞大，我们眼前的这些军队根本不够。
desc_dialogue 223=我们的一部分军队已经被敌人包围，现在需要立即将他们营救出来。
desc_dialogue 224=敌人已经构筑了一条强大的防线，看来我们遇到麻烦了。
desc_dialogue 225=盟友的败退让我们陷入被动的局面！现在我不得不重新评估战场的形势。
desc_dialogue 226=我们击败眼前的敌军应该不难，但是敌人的援军已经接近这里了。
desc_dialogue 227=虽然我们取得了一定的胜利，可我们部队的损失也非常的严重。
desc_dialogue 228=士兵们!消灭一切阻拦我们的敌人，我们需要在指定的时间赶到战场。
desc_dialogue 229=虽然我们面对的是敌人最精锐的部队，但那又怎样。我们一样可以消灭他们！
desc_dialogue 230=战斗非常激烈，现在还看不出战场的形势对谁更有利。
desc_dialogue 231=我的部队在上次战役中损失太大，现在就让我们再次发动进攻显然不太实际。
desc_dialogue 232=看来我们这次需要合作来击退敌军，否则很难在规定的时间内完成任务。
desc_dialogue 233=每一次给部队下达命令时都要非常慎重，指挥部不会给你太多的时间。
desc_dialogue 234=时间已经不多了，我希望你尽快完成任务。
desc_dialogue 235=我的部队已经占领了敌军最重要的交通枢纽，现在战场的主动权在我们手里。
desc_dialogue 236=前方就是敌军最重要的城市，他们已经集中了所有的力量来保卫这里。
desc_dialogue 237=我们这次的目标是夺取前方的岛屿，我的舰队会掩护你的部队登陆作战。
desc_dialogue 238=夺下前面的据点，无论我们付出什么样的代价都要做到。
desc_dialogue 239=我们一直处于中立的状态，希望战争不要涉及到我们的领地。
desc_dialogue 240=我们不愿意参与战争，我们想要的只是和平。
desc_dialogue 241=我和我的人民都希望永远和平，战争本身就是一种犯罪。
desc_dialogue 242=请不要尝试侵略我们的国土，我们也有自己的军队。
desc_dialogue 243=士兵们都陷入了混乱，他们不愿意执行我的命令！
desc_dialogue 244=我们的后勤补给出现了问题，士兵们已经无法作战了！
desc_dialogue 245=这是一场毫无意义的战争，我的士兵都不愿意去送死！
desc_dialogue 246=我已经无法指挥我的军队了，这场战争已经输了。
desc_dialogue 247=我要将这里全部烧毁，不让它落入敌人的手中！
desc_dialogue 248=开始点火！让敌人全部葬身火海吧。
desc_dialogue 249=火势已经发展到无法控制的地步，难道必须撤退了么？
desc_dialogue 250=用火阻挡住敌人进攻的路线，这是最有效的办法。
desc_dialogue 251=士兵们！控制住火势，抓紧时间灭火。
desc_dialogue 252=士兵们！现在还不是休息的时候，继续前进，我们需要占领更多的地区！
desc_dialogue 253=我的军队需要在这里休整，为下一步的进攻做好准备。
desc_dialogue 254=在不断的攻占敌人领土后，我将获得更多的荣耀。士兵们！我们可以好好的庆祝一下。
desc_dialogue 255=我宣布！这个地区的领土已经属于我们的国家。
desc_dialogue 256=士兵们，不要放松！将有更多的地区等着我们去征服。
desc_dialogue 257=这里已经插上我们国家的旗帜，任何敌人都无法阻挡我们。
desc_dialogue 258=敌人已经在我的猛攻下溃散了。士兵们，让更多的敌人倒在我们的脚下吧！
desc_dialogue 259=我们轻松的歼灭了敌军，这是个好的开始。
desc_dialogue 260=敌人的炮火虽然猛烈，可是依然无法阻止我前进。
desc_dialogue 261=看来等战争结束，我们又能获得更多的奖赏了。
desc_dialogue 262=对手根本不堪一击，我需要真正的对手。
desc_dialogue 263=弱者，根本无法在战场上生存！胜利只属于强者。



;VICTORY 
desc_victory 1=指挥官阁下！你获得了一场完美的胜利。你将获得50个勋章的奖励。
desc_victory 2=指挥官阁下！你用一场胜利向我们展现了杰出军事才能。你将获得25个勋章的奖励。
desc_victory 3=指挥官阁下！战胜敌军对你来说并不难，在这次战争中我军的优势十分明显。你将获得15个勋章的奖励。
desc_victory 4=指挥官阁下！我们付出了很大的代价才战胜敌军，当然最终的胜利任然属于你。你将获得5个勋章的奖励。
desc_victory 5=指挥官阁下！你的指挥或许犯了一些错误，我甚至怀疑你是否能够战胜敌军。这样的战绩将无法获得奖励。

;NWVICTORY
desc_victory 1 no award=指挥官阁下！你获得了一场完美的胜利。
desc_victory 2 no award=指挥官阁下！你用一场胜利向我们展现了杰出军事才能。
desc_victory 3 no award=指挥官阁下！战胜敌军对你来说并不难，在这次战争中我军的优势十分明显。
desc_victory 4 no award=指挥官阁下！我们付出了很大的代价才战胜敌军，当然最终的胜利任然属于你。

;FAILURE
desc_failure 1=指挥官阁下！这次作战失利使我们陷入被动。我无法接受你关于失败的解释。现在你将被解除指挥权。
desc_failure 2=指挥官阁下！你没能在规定的时间内完成任务，以致我们最终失利。现在你将被解除指挥权。

