; tips desc
text_tips_1=城市、工厂、马厩、军港、农场都能升级，也能为部队提供补给。
text_tips_2=将军在战争中可以积累经验来提升军衔和爵位。
text_tips_3=农场会生产食物，如果部队缺少食物将无法作战。
text_tips_4=围城炮是对付敌方要塞和海岸炮的专家，也能给敌方建筑中的部队造成致命打击。
text_tips_5=每个将军都可以携带两个物品，它们会让将军获得更强的能力。
text_tips_6=拥有旗帜的将军可以对周围的友军提供支援。
text_tips_7=不同国家的部队能力存在差异，比如英国的军舰比其它国家的都要强。
text_tips_8=市场能够兑换资源，商店能购买物品，酒馆能招募将军。
text_tips_9=将军的技能会在战场上发挥巨大的作用。
text_tips_10=相同类型的部队如果编队数量越多，招募需要的资源也越多，当然战斗力会更强。
text_tips_11=轻步兵可以在复杂地形中保持最高的行动力。
text_tips_12=掷弹兵和近卫军是步兵中的多面手，他们能对付各种类型的敌军。
text_tips_13=机枪虽然行动力较差，但能对骑兵和步兵造成致命打击。
text_tips_14=骑兵拥有最高的行动力，对敌军的步兵或炮兵攻击后能使敌军士气下降，并在歼敌后再次行动。
text_tips_15=在炮火的攻击下目标区域很容易着火。部队在燃烧的区域会受到伤害。
text_tips_16=建造要塞可以增强陆地防御，海岸炮能对舰船造成巨大的伤害，但它们都要一定的建造时间。
text_tips_17=战壕，栅栏，掩体能够对部队提供保护，但是必须由步兵来建造。
text_tips_18=夹击和包围会让敌方部队士气下降，可以减弱敌方部队的攻击力和防御力。
text_tips_19=一旦部队发生混乱他们将不会执行任何命令！
text_tips_20=当食物不足时部队会士气下降，食物严重不足时部队会混乱。
text_tips_21=当将领有训练技能时，可训练提升所在部队的等级。
text_tips_22=不要随便占领友军的建筑，这可能会使他们解除与你的同盟关系！
text_tips_23=陆军部队在海中的攻击力会大幅下降。
text_tips_24=如果能完成战役中的特殊目标就可以解锁特殊章节！


html_notice=<br>1.城市、工厂、马厩、军港、农场都能升级，也能为部队提供补给。<br>2.将军在战争中可以积累经验来提升军衔和爵位。<br>3.农场会生产食物，如果部队缺少食物将无法作战。<br>4.围城炮是对付敌方要塞和海岸炮的专家，也能给敌方建筑中的部队造成致命打击。<br>5.每个将军都可以携带两个物品，它们会让将军获得更强的能力。<br>6.拥有旗帜的将军可以对周围的友军提供支援。<br>7.不同国家的部队能力存在差异，比如英国的军舰比其它国家的都要强。<br>8.市场能够兑换资源，商店能购买物品，酒馆能招募将军。<br>9.将军的技能会在战场上发挥巨大的作用。<br>10.相同类型的部队如果编队数量越多，招募需要的资源也越多，当然战斗力会更强。<br>11.轻步兵可以在复杂地形中保持最高的行动力。<br>12.掷弹兵和近卫军是步兵中的多面手，他们能对付各种类型的敌军。<br>13.机枪虽然行动力较差，但能对骑兵和步兵造成致命打击。<br>14.骑兵拥有最高的行动力，对敌军的步兵或炮兵攻击后能使敌军士气下降，并在歼敌后再次行动。<br>15.在炮火的攻击下目标区域很容易着火。部队在燃烧的区域会受到伤害。<br>16.建造要塞可以增强陆地防御，海岸炮能对舰船造成巨大的伤害，但它们都要一定的建造时间。<br>17.战壕，栅栏，掩体能够对部队提供保护，但是必须由步兵来建造。<br>18.夹击和包围会让敌方部队士气下降，可以减弱敌方部队的攻击力和防御力。<br>19.一旦部队发生混乱他们将不会执行任何命令！<br>20.当食物不足时部队会士气下降，食物严重不足时部队会混乱。<br>21.当将领有训练技能时，可训练提升所在部队的等级。<br>22.不要随便占领友军的建筑，这可能会使他们解除与你的同盟关系！<br>23.陆军部队在海中的攻击力会大幅下降。<br>24.如果能完成战役中的特殊目标就可以解锁特殊章节！


;tutorials word
desc_tutorials_word_1=指挥官阁下，下面我来给您介绍下最基本的操作。
desc_tutorials_word_2=首先金钱、工业、食物是我们进行战争的必要物资。
desc_tutorials_word_3=触摸单个区域可以看到该地区的生产值和工业值，还有该地区的信息。(请点击箭头指示区域)
desc_tutorials_word_4=每个国家都有属于自己的版图颜色。
desc_tutorials_word_5=部队面板上的图案和颜色分别表示的该部队的类型和阵营。
desc_tutorials_word_6=部队的旗帜飘动表明这个部队仍然可以行动。
desc_tutorials_word_7=不同的建筑可以雇佣不同的部队，高等级的建筑可以雇佣更多类型的部队。
desc_tutorials_word_8=在招募部队时可以选择部队的编队数量，编队数量越高战斗力越强，但是消耗的食物也更多。
desc_tutorials_word_9=触摸部队就可以对部队进行操作，白色的光圈表示部队可以行动的区域，红色光圈表示您可以攻击的目标。
desc_tutorials_word_10=如果您觉得您的部队行动失误可以让他们立即返回。
desc_tutorials_word_11=所有的军事辅助设施必须由步兵建造，不同的军事辅助设施也有不同的作用。
desc_tutorials_word_12=建造要塞和海岸炮都需要一定的时间才能完工，每回合只能建造一次。
desc_tutorials_word_13=如果想要让部队渡海就必须要给该部队配备运输舰。
desc_tutorials_word_14=您可以给您的部队指派已经招募到的将领。
desc_tutorials_word_15=注意：这个标志的建筑表示这是一个关键据点。占领或者丢失这里将直接影响到战争的结果。
desc_tutorials_word_16=点击右下方的小沙漏可进行下一回合。
desc_tutorials_word_17=如果您想更好的了解战场上的战术请阅读高级教程。
desc_tutorials_word_18=指挥官阁下，下面我来给您介绍一些高级的战术。
desc_tutorials_word_19=建筑和某些地形会对部队产生一定的保护作用。
desc_tutorials_word_20=所有的建筑可以补给受损的单位，建筑等级越高补给越多。
desc_tutorials_word_21=部队经历过战斗后会升级，等级越高的部队战斗力越强。
desc_tutorials_word_22=士气上升或下降将直接关系到一个部队的战斗力，当部队被夹击或包围时会对士气有很大的影响。
desc_tutorials_word_23=部队在消灭敌人或被骑兵攻击后，士气会有一定的几率发生变化。
desc_tutorials_word_24=如果您的将领有训练能力，您可以通过训练来提升部队的等级。
desc_tutorials_word_25=部队在受损严重的情况下可以使用补给品补给。
desc_tutorials_word_26=部队如果混乱，他们将不会执行您的命令。
desc_tutorials_word_27=当部队在士气下降的时候您可以使用物品来恢复。
desc_tutorials_word_28=骑兵在消灭敌人后会获得突进效果可以继续攻击。
desc_tutorials_word_29=城市、工厂、马厩、农场都可以升级。
desc_tutorials_word_30=有些建筑会有酒馆、市场、商店，他们都有特殊的作用。
desc_tutorials_word_31=在火焰中的部队会持续受到伤害，火势越大受到的伤害越高。
desc_tutorials_word_32=不要占领友军的建筑，也不要随意攻击中立的国家。
desc_tutorials_word_33=指挥官阁下，请开始您的军事生涯吧！


;desc campaign
desc_1 zone 1=反法同盟已经在叛军的帮助下占领了我国多个城市，同时敌人的舰队也已经进驻了土伦港。我们已经向敌军发动了几次攻击，但是无法击退他们。指挥官阁下，你必须保卫祖国，将这些侵略者赶出去。拿破仑少校将会协助你一起作战。
desc_1 zone 2=如今我们正面临一场危机。敌人组成了一个新的联盟准备从意大利方向入侵法国，敌军的数量是我们的好几倍。对此总司令拿破仑将军已经准备出征了。指挥官阁下，希望你能改变意大利战场的局势，击溃敌军，夺取意大利地区。
desc_1 zone 3=我们的军队已经推进到曼图亚要塞附近，这个要塞是奥地利人在意大利最后的防线。拿破仑将军已经准备向曼图亚要塞发起攻击。指挥官阁下，敌人会不惜一切的保卫他们的要塞，而你的任务是阻止敌人的援军，最后和拿破仑将军共同夺取要塞。
desc_1 zone 4=在获得一系列胜利后，你已经被视为法国的英雄。现在拿破仑将军计划进攻埃及并担任东征军司令，他希望我们能尽快达成目标，将埃及归为法国的殖民地。指挥官阁下，请注意地中海上强大的英国舰队，如果能击退他们，我们才有可能夺取整个北非。
desc_1 zone 5=我们已经控制了埃及，接下来将以埃及为基地夺取整个北非地区。如果你能达成目标，法国除了能收获巨大的殖民地，还能切断英国和印度之间的运输线。指挥官阁下，由于拿破仑将军已经率先返回巴黎，你只能独自指挥作战。
desc_1 zone 6=指挥官阁下，前方战场的形势已经发生了巨大的变化，反法联军倾其全力向我们展开进攻，他们在很短的时间内就攻占了马伦哥地区，可以说敌军的强大已经超出了我们的预料，目前拿破仑将军需要你的支援，否则前线的法军就将全线崩溃。
desc_1 zone 7=我们和西班牙的联合舰队已经被英国完全击败，更可怕的是普鲁士也打算向我们宣战,这一度引起了大家的恐慌。现在我们唯一能做的就是尽快击败俄罗斯与奥地利的联军。指挥官阁下，背水一战的时刻到了，我们必须在普鲁士的军队赶到前结束战斗。
desc_1 zone 8=皇帝似乎并不知道他的扩张政策已经让普鲁士对我们的敌意越来越强，或许这一场战争将无法避免。目前敌军的主力部队已经向我们靠近。指挥官阁下，率领你的军队击败他们。皇帝的目标是夺取柏林。
desc_1 zone 9=在击败普鲁士后，帝国的军队继续追击敌军。目前我们已经深入到东普鲁士地区。目前普鲁士的军队在俄国的帮助下又重新集结起来，并组成了新的联军。指挥官阁下，如果我们能击溃他们，帝国的版图将再次扩大。
desc_1 zone 10=西班牙和葡萄牙在获得英国的援助后，完全站在了英国人那边。而我们派往西班牙的军队由于太过分散，被当地民兵击败。又有一支英军已经在葡萄牙登陆。指挥官阁下，皇帝陛下希望你能挽回败局，彻底占领西班牙和葡萄牙，把英国人赶回海上去！
desc_1 zone 11=普鲁士和奥地利组成的反法联军已经占领了帝国控制的德意志地区。一心想要复仇的皇帝集结了一支强大的东征军，但是由于过于突进反而被联军包围。目前敌军占据着的巨大的优势。指挥官阁下，我们必须立刻增援皇帝，否则战局将无法挽回。
desc_1 zone 12=整个欧洲大陆只有俄国还没有向我们臣服。皇帝终于决定远征俄国。虽然我们的军队有着空前的规模，但是我们也面临兵力分散和食物补给短缺等问题，而最可怕的还是俄国严寒天气。指挥官阁下，我本人对战争的前景不太乐观.
desc_1 zone 13=帝国军队在俄国的失败已成定局。同时由于食物短缺和疾病流行，军队的士气大幅下降。而寒冷的天气和俄军不断的攻击让皇帝无法安全撤退。指挥官阁下，目前是否胜利已经不再重要。请率领你的军队保证皇帝的安全。
desc_1 zone 14=帝国在远征俄国时遭受了重大损失。目前欧洲多国重新组成了反法同盟，以前臣服于我们的那些小国也纷纷脱离了帝国的控制，帝国陷入了前所未有的困境。指挥官阁下，皇帝和我们都了解，要脱离目前的困境，没有什么比取得一场胜利更重要了。
desc_1 zone 15=反法同盟各国一起发起了动员令，英国也将他的主力陆军派遣到欧洲大陆。指挥官阁下，如果等敌人集结完成我们是没有机会获胜的，我们必须主动出击，击败在法国东部集结的反法同盟军队。这次作战计划就像是一次赌博，不过至少我们还有希望。
desc_1 zone 16=我们的作战获得了完美的成功，欧洲大陆各国再次向我们臣服。现在只有大不列颠岛上的英国还在负隅顽抗。在经过长期准备后，皇帝觉得是时候向英国发起全面进攻了。指挥官阁下，你应该知道英国仍然拥有世界上最强大的舰队。
desc_1 zone 17=英国的残余势力都退到了他们北美的领地加拿大，由于我们已经夺取了北爱尔兰的重要港口，帝国有能力在短暂的休整后向大西洋对面的敌人发起远征。指挥官阁下，皇帝下令要彻底消除来自英国人的威胁，突破他们的海上防线，将帝国的版图再次扩大。
desc_1 zone 18=在之前的登陆作战中，我们损失了不少军队。在我们等待补给的时候，英国和美国已经结成同盟。美国也正集结大量的部队向我们逼近。指挥官阁下，帝国的目的是获得整个美洲，而敌人非常强大，稍有大意我们就会被赶下海喂鱼。

desc_2 zone 1=法国爆发了革命，他们将自己的国王送上了断头台。这是欧洲各国皇室都无法容忍的事情。指挥官阁下，我们已经和其他各国缔结盟约，并决定依靠军事的力量对那些叫嚣着推翻君主制的法国人实施镇压，指挥部希望你能胜利完成任务！
desc_2 zone 2=反法联军的介入已经产生了效果，法国的多个地区都出现了反对革命的势力。在土伦的保皇党甚至请求联军派兵进入土伦港。指挥官阁下，虽然我们已经完全控制了这个港口，但法国国内的革命军已经从各个方向向我们涌来，局势非常严峻。
desc_2 zone 3=法国的远征军已经在埃及的亚历山大港口登陆了。如今已经无法阻止法军在埃及的胜利。目前我们能做的就是保证皇家海军对地中海的控制，切断法军补给线。指挥官阁下，如果你能击溃法军在地中海舰队，那可以让法国在埃及的胜利变得毫无意义。
desc_2 zone 4=帝国的舰队在尼罗河取得了决定性的胜利，现在我已经控制了地中海，而拿破仑和他的军队则被围困在埃及。这是攻击法国最好的时机。指挥官阁下，你将负责收复帝国在意大利失去的领地，并协助同盟国击败莱茵地区的法国军队。
desc_2 zone 5=俄国和神圣罗马帝国的反法联军在很短的时间内就占领了意大利的大部分地区。但是法国人并不甘心失败，目前敌人已经调集了大量的兵力，企图包围和歼灭联军。指挥官阁下，现在前线的联军急需增援，你必须带领部队火速赶去支援。
desc_2 zone 6=在法国的威胁下，北欧各国已经正式下令对英国所有舰船进行贸易封锁。帝国的海上贸易受到了严重的损失，连皇家战舰所需的木材都无处获取。指挥官阁下，我们需要给他们一点教训，你必须击败北欧各国的舰队并阻止法国的援军。
desc_2 zone 7=法国皇帝拿破仑制定了向英国本土进军的计划。为了对抗我们强大的皇家海军，法国和西班牙成立了规模庞大的联合舰队。指挥官阁下，绝不能让侵略者在不列颠岛登陆。我们必须消灭敌人的舰队，让拿破仑放弃登陆不列颠岛。
desc_2 zone 8=在刚刚结束的海战中法国海军已经被我们彻底击败。因此法国迫切需要获取陆地战场的胜利来挽回失败。面对法国军队凶猛的进攻，俄奥联军已经做好了反击准备。指挥官阁下，这场战役意义重大，尽管联军占据优势但仍然没有必胜的把握。
desc_2 zone 9=最近法国对我们做出了诸多无礼行为，他们的军队随意进入普鲁士的领土，甚至还用武力驱赶我们的驻军。国王认为这些行为是对普鲁士的挑衅。指挥官阁下，我们将和欧洲各国成立新的反法同盟。希望你能在战场上回敬法国人对我们的侮辱。
desc_2 zone 10=法军击溃了普鲁士的主力，并在占领柏林后继续向东推进。如果我们不加以阻止，很快整个普鲁士都将被法国占领。对此俄国已经派出援军接应后撤的普鲁士军队。指挥官阁下，我们需要减缓法军的推进速度来为联军的集结争取时间。
desc_2 zone 11=丹麦正执行法国对我们的海上封锁政策，帝国的舰队目前无法穿越波罗的海。指挥官阁下，连接波罗的海对帝国至关重要，皇家海军将使用武力打开通往波罗的海的道路。请注意！敌人并不是只有丹麦，你需要时刻小心法国的舰队。
desc_2 zone 12=拿破仑先是入侵了拒绝服从他命令的葡萄牙，之后又以保护西班牙领土为名让法国大军进入西班牙。我们的人民无法忍受法军的残暴行为，他们纷纷起来反抗侵略者。指挥官阁下，英国也派出一支精锐部队，他们将协助你战胜法军。
desc_2 zone 13=法国目前陷入了西班牙战争中，拿破仑也亲自在西班牙前线指挥，现在正是向法国进攻的最佳时机。为此我们已经重新建立了反法同盟。指挥官阁下，各国的联军已经集结完毕，我们将对法国发动一次突袭，如果计划成功法国将被迫进行双线作战。
desc_2 zone 14=法军在俄国遭受了致命的失败，他们令整个欧洲大陆颤栗的大军已经不复存在了。如今拿破仑正向法国溃逃，他很清楚这次失败意味着什么。指挥官阁下，我们需要你在拿破仑重整军队前给予法国致命一击。
desc_2 zone 15=法国在俄国的失败极大的动摇了法国的权威，欧洲各国再次团结起来反抗法国的统治。目前联军正在向法国前进，而拿破仑也重新集结了军队，一场决战即将开始。指挥官阁下，这场战争将决定整个欧洲的命运。
desc_2 zone 16=我们接到消息，拿破仑已经从厄尔巴岛逃回了法国，并重新夺取了政权。此时他正率领新组建的法军在向我们进攻。这个消息让我们感到震惊。指挥官阁下，如果我们战败，那么拿破仑将再次崛起，并可能会继续控制整个欧洲。
desc_2 zone 17=反法同盟的军队已经逼近法国的边境。毫无疑问，拿破仑的失败将无法避免。即使如此拿破仑依然在集结它最后的力量。指挥官阁下，虽然联军数量远远超过法军，但是剩余的法军都是精锐部队，您一定要做好充分的准备。

desc_3 zone 1=法国为了控制莱茵地区而筹划了莱茵联邦。目前神圣罗马帝国在莱茵地区的邦国都纷纷脱离了帝国的控制而加入了莱茵联邦，成为法国的附庸国。指挥官阁下，如果我们不加以阻止将会有更多的邦国继续投向法国，那时恐怕我们将会被法国孤立甚至侵占。
desc_3 zone 2=与法国的连年战争让帝国蒙受了巨大的损失，帝国的周边领土也在战争中不断被侵占，皇帝认为必须收回失去的领土来证明帝国依然拥有强大实力。指挥官阁下，虽然时间紧迫，但在开战之前我们必须先组建一支强大的军队。
desc_3 zone 3=长期在欧洲大陆的战争使帝国后方空虚，奥斯曼帝国居然趁机对帝国发动了侵略战争，并攻占了帝国大片领土。皇帝对此非常愤怒，他命令我们必须收复被侵占的领土。指挥官阁下，我们要让奥斯曼帝国为此付出代价。
desc_3 zone 4=法国在之前入侵俄国的战争中大伤元气。现在精锐的俄普联军正向法国挺进。虽然拿破仑花费心思重建了军队，但国王认为敌人在仓促中重建的军队已不足为惧。指挥官阁下，让我们一起击败法军吧，向世界证明新的时代已经来临。
desc_3 zone 5=法国的节节败退给了我们重新夺回意大利的机会，我相信拿破仑现在已经没有能力向亚平宁半岛派出援军了。指挥官阁下，皇帝希望我们能够尽快夺回帝国曾经在意大利地区的统治地位，将法国人赶出亚平宁半岛。
desc_3 zone 6=法国在欧洲的统治地位已经彻底破灭，那些勉强凑集起来的卫星国即将纷纷离去。普鲁士国王号召莱茵地区的人民团结起来脱离并反抗拿破仑的统治。指挥官阁下，我们将带领德意志人民从法国手中解放整个莱茵地区。
desc_3 zone 7=曾经统治欧洲的法兰西帝国已经覆灭了，法国对德意志的统治也不复存在。国王认为这是瓦解莱茵邦国，并完成德意志地区统一的绝好机会。指挥官阁下，普鲁士的军队将在你的带领下击破各个邦国，完成德意志的统一。
desc_3 zone 8=曾经的神圣罗马帝国在经历了长时间的分裂后最终演变为普鲁士和奥地利两个国家。如今普鲁士王国已经完成了统一。而奥地利帝国也恢复了实力。神圣罗马帝国将再次复兴。指挥官阁下，决战即将开始，我们将决定谁是新帝国的主宰。
desc_3 zone 9=经历了长期的衰败和分裂后，神圣罗马帝国在我们的努力下再次复兴。现在帝国的目标是重新征服欧洲大陆，我们第一个要面对的就是昔日的霸主--法国。指挥官阁下，帝国军队即将对法国发起进攻，向全欧洲介绍新霸主的时候到了。
desc_3 zone 10=帝国的军队长驱直入，现在已经控制了大半个法国。法军的残部向西溃逃，并计划在西班牙地区集结军队来发动反攻。皇帝已下达了向伊比利亚半岛进军的命令。指挥官阁下，希望你能尽快控制并占领整个伊比利亚半岛。
desc_3 zone 11=帝国已经成为欧洲大陆的霸主，但英国却拒绝向我们臣服。在他们对帝国的海岸线进行频繁的骚扰后，皇帝的忍耐到了极限。指挥官阁下，作为回击，我们将对英国进行海上封锁并消灭英国的皇家舰队，请尽早准备。
desc_3 zone 12=在帝国击败英国皇家舰队后，英国彻底丧失了制海权。他们现在被迫困守大不列颠岛。指挥官阁下，皇帝已经下令，我们对大不列颠岛进行登陆作战。这将会是场艰苦的战斗，敌人必定会拼死抵抗，只靠勇气是难以取得胜利的。
desc_3 zone 13=奥斯曼帝国长期和我们争夺巴尔干地区的统治权。双方为此已经进行了旷日持久的战争。随着帝国日益强大，皇帝认为是时候解决这些问题了。指挥官阁下，如果我们能完全征服奥斯曼帝国，那么帝国将有机会远征北非。
desc_3 zone 14=如今奥斯曼帝国已经无法与我们抗衡。现在是时候接管奥斯曼帝国在北非的领土了。指挥官阁下，由于帝国很多区域目前还不稳定，需要依靠军队维持，因此你只能依靠有限的军队去完成这次远征。
desc_3 zone 15=在完全控制欧洲以后，帝国已经具备了远征美洲的实力。皇帝和大臣们为此已经讨论了很久。指挥官阁下，皇帝任命你为总指挥，如果你能够顺利的在北美海岸登陆并建立据点，那么之后的作战就会相对容易。相信你一定不会辜负皇帝的期望。
desc_3 zone 16=虽然帝国成功占领了北美的几个东部沿海的城市，但是由于兵力有限，我们不得不将面对数量多出我们数倍的敌人。指挥官阁下，皇帝命令你继续进攻，将整个北美归入帝国的版图！帝国的援军已经在路上了，请你做好准备。

desc_4 zone 1=法国向埃及派出了远征军。现在法国的军队已经攻占了亚历山大港口，很快他们将侵占埃及甚至整个北非。指挥官阁下，苏丹命令你去协助埃及的军队抵抗法国的入侵，英国人表示他们的舰队会对我们提供海上支援。
desc_4 zone 2=我们与波斯帝国长久以来一直持续着领土纷争。沙皇认为我们需要通过一次强硬的军事行动向波斯帝国表明我们的态度。指挥官阁下，你将率领帝国军队去击溃波斯军队并夺回原本属于我们的领土。同时需要注意法国和英国都会因为各自利益介入这次战争。
desc_4 zone 3=法国目前正陷入欧洲大陆的战争，这正是帝国收复已经被法国侵占领土的最好时机。英国海军将会全力协助我们击退海上的法国舰队。指挥官阁下，你必须迅速击溃敌人，在法国本土派出援军前攻占全部目标，这将迫使法国放弃北非殖民地。
desc_4 zone 4=由于瑞典国王拒绝加入对英国的海上封锁，法国已经将瑞典视作敌对国，法国皇帝希望与帝国联手对瑞典发动进攻。沙皇认为我们可以借此夺取瑞典的领土。指挥官阁下，根据计划我们的部队将从芬兰地区发动攻击，当然英国一定会对瑞典进行最大限度的支援。
desc_4 zone 5=英国要求我们交出奥斯曼舰队以及达达尼尔上的要塞，否则他们的皇家舰队将进入达达尼尔海峡，同时英国陆军也将对埃及发动攻击。指挥官阁下，苏丹已经拒绝了他们的要求，他同时命令我们必须击退英国的入侵，法国将会协助我们进行防御。
desc_4 zone 6=塞尔维亚地区在俄国人的支持下爆发了要求独立的叛乱事件，一旦他们独立成功势必将对帝国的其他地区产生影响甚至威胁帝国的统治。苏丹下令必须不惜一切代价制止叛乱。指挥官阁下，你被任命负责阻止叛乱。请注意，我们的敌人可能不光只有叛军。
desc_4 zone 7=法国已经在帝国的边境集结了一支空前规模的大军，我们与法国的战争将无法避免。沙皇号召全国人民团结一致，与侵略者战斗到最后。指挥官阁下，请你率领你的军队和其他将军一起抗击法国入侵者。虽然敌人非常强大，但是我们绝不能后退半步。
desc_4 zone 8=虽然帝国的军队英勇抗战，但还是难以抵挡法国大军的进攻。最高司令部下达了实施焦土作战的命令。根据作战计划，我们将放弃莫斯科向后撤退，并烧毁沿途的一切物资。俄罗斯的寒冬将会给入侵者最严厉的打击。指挥官阁下，我们反击的时刻或许不远了。
desc_4 zone 9=寒冬与疾病击溃了那支不可一世的法军，拿破仑已经命令他部队准备撤出俄国。现在是时候给法国入侵者最后一击了，沙皇殿下发出了全面反击的命令。指挥官阁下，我们要把敌人击溃并全部赶出俄国，同时解放那些被侵略者占领的城市。
desc_4 zone 10=奥斯曼帝国对俄国的多次领土战争都以失败而告终。但是当法国远征俄国后一切都将改变，虽然最后俄国击退了法国，但是他们自身也付出了巨大的代价。指挥官阁下，现在我们是我们彻底击败俄罗斯帝国的最佳时机。这也将是决定双方命运的一次战争。
desc_4 zone 11=俄罗斯帝国被我们击败了！毫无疑问，奥斯曼帝国取得了战争的最终胜利。但敌人的残余力量仍然在继续抵抗，苏丹已经下令征服俄罗斯帝国的全部领土。指挥官阁下，必须清除敌人的残余反抗势力，我们将创造出一个全新的东方帝国。
desc_4 zone 12=奥斯曼帝国被我们击败了！毫无疑问，俄罗斯帝国取得了战争的最终胜利。但敌人的残余力量仍然在继续抵抗，沙皇已经下令征服奥斯曼帝国的全部领土。指挥官阁下，必须清除敌人的残余反抗势力，我们将创造出一个全新的东方帝国。
desc_4 zone 13=帝国在东欧的统治地位已经稳固，皇帝认为是时候向西扩张了。欧洲各国已经成立了一个新的联盟来和帝国对抗，但是他们是无法抵挡帝国军队的。指挥官阁下，这是将是一场展示帝国荣耀的战斗，带领你的军队去完成皇帝的使命吧。
desc_4 zone 14=帝国的军队已经横扫了欧洲大陆，目前欧洲大部分国家都已经臣服与帝国，但依然有一部分反抗势力退居到西班牙，并企图与英国联手对帝国进行反攻。指挥官阁下，皇帝已向你下达了最新命令，消灭一切敢于反抗帝国的敌人。

desc_5 zone 1=当列克星敦的枪声响起后，战争其实已经开始了。英王已经正式向我们宣战，并调集大军向我们发起攻击。指挥官阁下，事实上我们并没有多少胜算。我们的军队都是民兵，装备也比英军差很多。但是我相信我们代表的着正义，因此我们必定会获得胜利。
desc_5 zone 2=根据情报，英军准备利用南部有利的条件将部队主力转移。并企图向我们南方几个州的驻军发起突袭。指挥官阁下，总司令已经制定了新的作战计划。我们将与盟友法国，荷兰，西班牙陆海军配合控制沿海基地，阻止英军的计划。
desc_5 zone 3=经过我们长期的英勇抗战，英军开始逐渐败退，因此华盛顿总司令下令开始进行全面战略反攻。目前剩余的英军已经被迫退守海岸线和要塞之中。指挥官阁下，我们必须完全消灭顽抗的英军，这样才能让英国放弃对北美殖民地的统治。
desc_5 zone 4=法国爆发了革命并成立新的政府。由于我们采取中立政策，因此导致了法国的敌视。目前法国的舰队沿着北美海岸线不断的袭击我们和英国的商船，但我们却没有战舰可以与之对抗。指挥官阁下，国会已经批准重建海军，你必须保护美国的商船与海岸线。
desc_5 zone 5=我们与法国进行了交易，购买了路易斯安纳地区。虽然我国的领土因此增加了一倍，但想要接管新的领土却困难重重。西班牙因为边界问题与我们产生了冲突，当地的土著居民也对我们发起了攻击。指挥官阁下，总统认为我们只能通过武力来解决这些问题。
desc_5 zone 6=如今英国已经成为了我们发展的最大阻碍。国会正式通过以军事行动将英国势力赶出北美大陆的决定。目前英国的主力军队都被欧洲大陆的战争拖住，这对我们无疑是一次绝佳的机会。指挥官阁下，你将率领部队向加拿大地区的英军发起进攻。
desc_5 zone 7=由于我们低估了英军的力量而导致目前陷入了被动局面。英国派遣出大量战舰对我们的港口进行了封锁，同时英国还将大量的陆军运送到北美海岸，目前英军已经占领了我们的首都--华盛顿。指挥官阁下，你必须突破英军的封锁，否则我们难以夺回首都。
desc_5 zone 8=目前战争已经进入了最后的阶段。由于在欧洲大陆的战争已经结束，英国人可以把主力部队调往北美，同时英国还和印第安部落组成了同盟。指挥官阁下，这次的敌军规模非常庞大，即使如此，我们依然必须击败敌军，这样我才可能统一北美。
desc_5 zone 9=由于我们的海军在之前的作战中击败了英国皇家海军，这使得直接登陆不列颠岛的作战变为了可能。国会已经通过了向英国本土进攻的计划。指挥官阁下，总统已经任命你为总指挥，我们的军队将尝试从苏格兰岛登陆，并最终占领整个不列颠岛。
desc_5 zone 10=经过长久的准备，我们已经完全具备了向欧洲大陆进军的条件。现在我们将实施绝密的登陆作战计划。指挥官阁下，你将率领军队在伊比利亚半岛秘密登陆并在其他欧洲国家做出反应之前迅速控制西班牙地区。我们可以在那里建立一个向欧洲大陆进军的基地。
desc_5 zone 11=当我们的军队出现在西班牙的时候让欧洲各国大为震惊。但是他们很快就组成了一个针对我们的军事联盟。在继续前进的过程中我们并没有遭遇大规模的敌军，直到我们陷入了联军的包围中。指挥官阁下，接下来你面临的将是一条地狱之路，希望能顺利突围。
desc_5 zone 12=我们击溃了欧洲联军并控制了欧洲大部分领土，剩余的欧洲国家再次集结了军队妄图拼死一搏，虽然他们在上一次战争中遭受了的失败但依然拥有兵力上的优势。指挥官阁下，如果你能再次击溃联军，那我们就可以成为欧洲的新主宰。

desc_6 zone 1=北美殖民地的人民与帝国的矛盾不断激化，最后殖民地成立了自己的武装力量，他们企图通过武力来脱离帝国的统治。如果我们不能战胜这些叛乱者，那么帝国很快就会失去北美的殖民地。指挥官阁下，你必须从这些暴民手中拯救帝国的殖民地。
desc_6 zone 2=叛军的残余势力已经撤退到了北美中部地区，他们和当地的印第安人组成了庞大的联军。当然法国人也提供给了他们一批庞大的军事物资。为了维护殖民地的稳定并扩大殖民地，总督决定对这些敌对势力发动一次突袭。指挥官阁下，你将负责指挥这次作战。
desc_6 zone 3=为了镇压法国革命，同时也为了夺取法国的领土，国王已经命令皇家海军协助反法同盟进行战斗。指挥官阁下，你将在皇家海军的协助下从土伦港登陆法国，并尝试向法国内陆进军，如果我们能攻占巴黎，那么就应该可以阻止法国的革命。
desc_6 zone 4=法国的远征军已经攻占了亚历山大港口，如果他们继续前进控制了埃及，将严重威胁到帝国通往印度的航线。皇家海军已经收到国王的命令，消灭法国人在地中海的舰队。指挥官阁下，目前法国人的舰队集结在尼罗河口附近，消灭他们！将法国远征军围困在埃及。
desc_6 zone 5=西班牙海军一直是帝国海上最大的威胁。在法国的有力支持下，强大的西班牙舰队近期很可能向我们发动攻击。指挥官阁下，我们必须在敌人采取行动前率先发动进攻。首相希望你能带领皇家海军夺回海上霸权，再现帝国往日的辉煌！
desc_6 zone 6=法国集结欧洲各国企图对帝国进行海上封锁，一旦法国的封锁计划得逞那将会极大的打击帝国的经济。首相命令皇家海军必须优先保证波罗的海的贸易通畅。指挥官阁下，我们将与数个欧洲沿海国家为敌，你必须合理的安排有限的军队。
desc_6 zone 7=法国对西班牙发动了侵略战争，虽然西班牙人民奋起反抗，但如果没有外来援助，西班牙被法国占领恐怕只是时间问题。首相已经派出一支精锐部队前往欧洲援助西班牙。指挥官阁下，如果我们能在西班牙牵制住法军，将使法国面临双线作战的被动局面。
desc_6 zone 8=法国联合了多个国家组成了规模庞大的地中海舰队。显然他们的目的是为了能和帝国皇家海军相抗衡。指挥官阁下，帝国如果要称霸欧洲就必须完全获得欧洲的制海权。首相希望我们能主动出击，在敌人没有集结完成前向他们发起进攻。
desc_6 zone 9=由于战略上的失误，帝国皇家舰队陷入了敌人在黑海的包围圈。毫无疑问，在目前的形势下任何微小的失误都会使皇家海军遭受巨大损失。指挥官阁下，这将会是一场异常艰难的战斗。需要再次提醒你，在这里我们没有盟友。
desc_6 zone 10=帝国已经扫平了一切障碍，现在是时候和法国人决战了。我们和法国以往的一切恩怨都将在这场战争中结束。指挥官阁下，国王和首相一致决定把这个光荣而又艰巨的任务交给你来完成，向法国和他们的同盟军发起最后一击吧！


