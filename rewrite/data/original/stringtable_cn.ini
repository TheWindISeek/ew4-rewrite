desc_Blucher Sabre=非常锋利的骑兵军刀，骑兵攻击+4
desc_Trooper Sabre=为骑兵专门设计的马刀，骑兵攻击+2
desc_Horse Artillery=使用战马来运输的火炮，炮兵移动+2
desc_Oak Wheel=用橡木制作的火炮轮子，炮兵移动+1
desc_Helmet=坚固的铁质炮兵头盔，炮兵防御+6
